version: 2

# Dependabot is disabled for this repository
# Rationale:
# - AnonVote is a security-critical crypto protocol
# - Automated dependency PRs create noise and security review burden
# - Manual dependency updates allow deliberate audit + testing
# - CI jobs (cargo-audit, pnpm audit) catch vulnerabilities at build time
#
# To manually check for updates, use:
#   cargo outdated
#   pnpm outdated
#   npm outdated (if applicable)
#
# GitHub Actions should be updated manually after reviewing changelogs

updates: []

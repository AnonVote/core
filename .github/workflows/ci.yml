name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write
  pull-requests: read
  statuses: write

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════
  # 🔴 ESSENTIAL LAYER — Must pass for PR to merge
  # ═══════════════════════════════════════════════════════════════════════════════

  lint:
    name: Lint — Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm run lint

  typecheck:
    name: Typecheck — TypeScript & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm run build

  unit-tests:
    name: Unit Tests — Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install
      - name: Run unit tests
        run: pnpm run test
        env:
          SOROBAN_CONTRACT_ID: "CAUWQNFJP7TGZW4I7S2LYQ5IEUQJVKXB5JRFIVZFKPX6UVZVACADPMJ"
          SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
          NODE_ENV: "test"

  rust-wasm-build:
    name: Rust/WASM Build — Soroban Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          targets: wasm32v1-none
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Build WASM (release)
        run: cargo build --target wasm32v1-none --release --locked
      - name: Verify WASM output
        run: |
          WASM=target/wasm32v1-none/release/anonvote.wasm
          if [[ ! -f "$WASM" ]]; then
            echo "Error: $WASM not found after build"
            exit 1
          fi
          SIZE=$(wc -c < "$WASM")
          if [[ "$SIZE" -eq 0 ]]; then
            echo "Error: $WASM is empty"
            exit 1
          fi
          echo "WASM OK — ${SIZE} bytes at $WASM"

  rust-tests:
    name: Rust Tests — Soroban Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          targets: wasm32v1-none
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Run cargo tests
        run: cargo test --locked

  security-scan:
    name: Security Audit — Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm audit --audit-level=moderate

  cargo-audit:
    name: Cargo Audit — Rust Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
      - uses: rustsec/audit-check-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  rust-format:
    name: Rust Format — Code Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          components: rustfmt
      - run: cargo fmt --all -- --check
        name: Check Rust formatting

  rust-clippy:
    name: Clippy — Lint Warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          targets: wasm32v1-none
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-clippy-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-clippy-
      - run: cargo clippy --target wasm32v1-none --all-targets --locked -- -D warnings
        name: Run Clippy linter

  # ═══════════════════════════════════════════════════════════════════════════════
  # 🟠 HIGH-PRIORITY LAYER — Informational & Visibility, can fail without blocking merge
  # ═══════════════════════════════════════════════════════════════════════════════

  wasm-size-check:
    name: WASM Size Validation
    runs-on: ubuntu-latest
    needs: rust-wasm-build
    steps:
      - uses: actions/checkout@v4
      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: wasm-build
          path: ./artifacts
        continue-on-error: true
      - name: Check WASM size
        run: |
          WASM="target/wasm32v1-none/release/anonvote.wasm"
          if [[ ! -f "$WASM" ]]; then
            echo "Error: WASM file not found at $WASM"
            exit 1
          fi

          SIZE=$(stat -c%s "$WASM" 2>/dev/null || stat -f%z "$WASM" 2>/dev/null || wc -c < "$WASM")
          SIZE_KB=$((SIZE / 1024))

          # Soroban contracts should typically be < 256KB
          MAX_SIZE=$((256 * 1024))

          echo "WASM Size: ${SIZE_KB}KB (${SIZE} bytes)"

          if [[ $SIZE -gt $MAX_SIZE ]]; then
            echo "⚠️  WARNING: WASM exceeds recommended size (256KB)"
            echo "Current: ${SIZE_KB}KB | Recommended: 256KB"
          else
            echo "✅ WASM size OK"
          fi

  contract-spec-validation:
    name: Contract Spec — Interface Validation
    runs-on: ubuntu-latest
    needs: rust-wasm-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          targets: wasm32v1-none
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Generate contract spec
        run: |
          cargo build --target wasm32v1-none --release --locked 2>&1 | tee build.log

          # Extract contract metadata from build output
          if grep -q "soroban_spec" build.log; then
            echo "✅ Contract spec generated successfully"
          else
            echo "⚠️  Unable to verify contract spec generation"
          fi

  dependency-review:
    name: Dependency Review — Supply Chain
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-check_action@main
        with:
          path: "."
          format: "sarif"
          args: >
            --enable-experimental
            --scan .
      - uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: dependency-check-report.sarif

  secret-scanning:
    name: Secret Scanning — Credentials Detection
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug
        continue-on-error: true

  cargo-deny:
    name: Cargo Deny — Supply Chain Security
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          log-level: warn
          command: check
          arguments: --all-features

  contract-service-test:
    name: Contract Service — TypeScript Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies (service)
        working-directory: packages/contracts/service
        run: npm install
      - name: Run TypeScript tests
        working-directory: packages/contracts/service
        run: npm test

  test-crypto-integration:
    name: Crypto Integration Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm run test:integration --filter=crypto

  test-crypto-examples:
    name: Crypto Examples
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm run test:examples --filter=crypto

  fips-compliance:
    name: FIPS 140-2 Compliance
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install
      - name: Check OpenSSL version
        run: |
          echo "Node.js version:"
          node --version
          echo "OpenSSL version:"
          node -p "process.versions.openssl"
      - name: Run FIPS compliance tests
        run: pnpm run test:fips --filter=crypto
        env:
          FIPS_VALIDATION_ENABLED: "true"
          FIPS_VALIDATION_MODE: strict
          FIPS_LOG_RESULTS: "true"

  # ═══════════════════════════════════════════════════════════════════════════════
  # 🟡 SUPPLY-CHAIN & REPRODUCIBILITY LAYER — Build integrity & auditability
  # ═══════════════════════════════════════════════════════════════════════════════

  verify-locked-dependencies:
    name: Locked Dependencies — Reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cargo.lock is committed
        run: |
          if [[ ! -f "Cargo.lock" ]]; then
            echo "❌ ERROR: Cargo.lock not found"
            echo "Reproducible builds require Cargo.lock to be committed"
            exit 1
          fi
          echo "✅ Cargo.lock present"

      - name: Verify pnpm-lock.yaml is committed
        run: |
          if [[ ! -f "pnpm-lock.yaml" ]]; then
            echo "❌ ERROR: pnpm-lock.yaml not found"
            echo "Reproducible builds require pnpm-lock.yaml to be committed"
            exit 1
          fi
          echo "✅ pnpm-lock.yaml present"

      - name: Verify no uncommitted lock changes
        run: |
          cd "${{ github.workspace }}"

          # Check Cargo.lock
          cargo update --locked 2>&1 || {
            echo "⚠️  Warning: Cargo.lock may be out of sync (expected in CI)"
          }

          # Check pnpm-lock.yaml
          pnpm install --frozen-lockfile 2>&1 || {
            echo "❌ ERROR: pnpm-lock.yaml is out of sync or frozen-lockfile failed"
            exit 1
          }

          echo "✅ All lock files verified"

  generate-sbom:
    name: SBOM Generation — Supply Chain Transparency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"

      - name: Generate Node.js SBOM (pnpm)
        continue-on-error: true
        run: |
          pnpm install
          # Generate CycloneDX-formatted SBOM
          mkdir -p sbom
          echo "Generating JavaScript/TypeScript dependency manifest..."
          pnpm list --depth=-1 > sbom/nodejs-deps.txt || true

      - name: Generate Rust SBOM (Cargo)
        continue-on-error: true
        run: |
          # Install cargo-sbom if available
          cargo install cargo-sbom 2>/dev/null || true

          # Generate Cargo tree output for SBOM
          mkdir -p sbom
          cargo tree --locked > sbom/rust-deps.txt 2>/dev/null || {
            echo "⚠️  cargo tree not available, generating alternative manifest"
            cargo metadata --locked --format-version=1 > sbom/cargo-metadata.json 2>/dev/null || true
          }

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: sbom
          path: sbom/
          retention-days: 30

      - name: Generate reproducibility report
        run: |
          echo "📋 Reproducibility Report"
          echo "=========================="
          echo ""
          echo "Build Environment:"
          echo "  Node.js: $(node --version)"
          echo "  pnpm: $(pnpm --version)"
          echo "  Rust: $(rustc --version)"
          echo "  Cargo: $(cargo --version)"
          echo ""
          echo "Lock Files Status:"
          [[ -f Cargo.lock ]] && echo "  ✅ Cargo.lock" || echo "  ❌ Cargo.lock"
          [[ -f pnpm-lock.yaml ]] && echo "  ✅ pnpm-lock.yaml" || echo "  ❌ pnpm-lock.yaml"

  dependency-diff-check:
    name: Dependency Diff — Change Tracking
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Check pnpm-lock.yaml changes
        run: |
          echo "📦 Dependency Changes in This PR:"
          echo "===================================="
          echo ""

          # Get the base commit
          BASE_COMMIT=$(git merge-base origin/${{ github.base_ref }} HEAD)

          # Show pnpm-lock changes
          echo "pnpm Dependencies:"
          git diff $BASE_COMMIT..HEAD -- pnpm-lock.yaml | grep -E '^\+.*resolution:|^\-.*resolution:' | head -20 || echo "  No changes"

          echo ""
          echo "Cargo Dependencies:"
          git diff $BASE_COMMIT..HEAD -- Cargo.lock | grep -E '^\+name =|^\-name =' | head -20 || echo "  No changes"

  reproducible-build-check:
    name: Reproducible Build — Verification
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          targets: wasm32v1-none

      - name: Build WASM twice and verify hashes
        run: |
          echo "🔄 Building WASM contract (Build 1)..."
          cargo build --target wasm32v1-none --release --locked
          HASH1=$(sha256sum target/wasm32v1-none/release/anonvote.wasm | awk '{print $1}')

          echo "Cleaning build artifacts..."
          cargo clean

          echo "🔄 Building WASM contract (Build 2)..."
          cargo build --target wasm32v1-none --release --locked
          HASH2=$(sha256sum target/wasm32v1-none/release/anonvote.wasm | awk '{print $1}')

          echo ""
          echo "Build 1 Hash: $HASH1"
          echo "Build 2 Hash: $HASH2"

          if [[ "$HASH1" == "$HASH2" ]]; then
            echo "✅ Reproducible build verified — hashes match"
          else
            echo "⚠️  WARNING: Build hashes differ (non-deterministic build)"
            echo "This may indicate environment-dependent code generation"
          fi

  # ═══════════════════════════════════════════════════════════════════════════════
  # ✅ MERGE GATE — PR only merges if all essential checks pass
  # ═══════════════════════════════════════════════════════════════════════════════

  pr-merge-gate:
    name: PR Merge Gate — All Essential Checks
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - unit-tests
      - rust-wasm-build
      - rust-tests
      - security-scan
      - cargo-audit
    if: always()
    steps:
      - name: Verify all essential checks passed
        run: |
          echo "Checking essential CI layer..."
          echo ""

          FAILED=0

          # Check each essential job
          [[ "${{ needs.lint.result }}" == "success" ]] && echo "✅ Lint" || { echo "❌ Lint"; FAILED=1; }
          [[ "${{ needs.typecheck.result }}" == "success" ]] && echo "✅ Typecheck" || { echo "❌ Typecheck"; FAILED=1; }
          [[ "${{ needs.unit-tests.result }}" == "success" ]] && echo "✅ Unit Tests" || { echo "❌ Unit Tests"; FAILED=1; }
          [[ "${{ needs.rust-wasm-build.result }}" == "success" ]] && echo "✅ Rust/WASM Build" || { echo "❌ Rust/WASM Build"; FAILED=1; }
          [[ "${{ needs.rust-tests.result }}" == "success" ]] && echo "✅ Rust Tests" || { echo "❌ Rust Tests"; FAILED=1; }
          [[ "${{ needs.security-scan.result }}" == "success" ]] && echo "✅ Security Scan (pnpm audit)" || { echo "❌ Security Scan (pnpm audit)"; FAILED=1; }
          [[ "${{ needs.cargo-audit.result }}" == "success" ]] && echo "✅ Cargo Audit (Rust deps)" || { echo "❌ Cargo Audit (Rust deps)"; FAILED=1; }

          echo ""
          if [[ $FAILED -eq 1 ]]; then
            echo "🚫 MERGE BLOCKED — Essential checks failed"
            exit 1
          fi

          echo "✅ All essential checks passed — PR ready to merge"

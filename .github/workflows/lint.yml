name: Lint & Format (Optional)

on:
  pull_request:
    branches: [develop]
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - ".github/workflows/lint.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: ESLint & Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Run lint
        run: |
          pnpm -C apps/frontend run lint || true
          pnpm -C apps/backend run lint || true
          pnpm -C packages/contracts run lint || true
          pnpm -C packages/crypto run lint || true
        continue-on-error: true

# cargo-deny configuration
# Reference: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Deny advisories with the given severity
db-path = "$CARGO_HOME/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db/raw/main/db.json.gz"]
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"

[licenses]
# Allow licenses
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "0BSD",
  "Unicode-DFS-2016",
]

# Deny certain licenses
deny = [
  "GPL-2.0",
  "GPL-3.0",
  "AGPL-3.0",
]

[bans]
# Deny duplicate dependencies (useful for catching dependency bloat)
allow = []
deny = []
skip = []

# Lint level for when multiple versions of a crate are detected
multiple-versions = "warn"

# Lint level for when an unofficial replacement is detected
wildcards = "warn"

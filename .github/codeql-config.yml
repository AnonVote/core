name: "AnonVote CodeQL Config"

# Paths to exclude from CodeQL analysis
paths-ignore:
  - node_modules
  - dist
  - build
  - target
  - coverage
  - "**/*.test.ts"
  - "**/*.spec.ts"

# Queries to run
queries:
  - uses: security-and-quality
  - uses: security-extended

# Include queries for the languages being analyzed
disable-default-queries: false

# Additional configuration for specific languages
languages:
  - typescript
  - cpp

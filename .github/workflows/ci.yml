name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm run lint

  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install
      - name: Run tests
        run: pnpm run test
        env:
          SOROBAN_CONTRACT_ID: "CAUWQNFJP7TGZW4I7S2LYQ5IEUQJVKXB5JRFIVZFKPX6UVZVACADPMJ"
          SOROBAN_RPC_URL: "https://soroban-testnet.stellar.org"
          NODE_ENV: "test"

  test-crypto-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm run test:integration --filter=crypto
        continue-on-error: true

  test-crypto-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm run test:examples --filter=crypto
        continue-on-error: true

  fips-compliance:
    name: FIPS 140-2 Compliance Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install
      - name: Check OpenSSL version
        run: |
          echo "Node.js version:"
          node --version
          echo "OpenSSL version:"
          node -p "process.versions.openssl"
      - name: Run FIPS compliance tests
        run: pnpm run test:fips --filter=crypto
        env:
          FIPS_VALIDATION_ENABLED: "true"
          FIPS_VALIDATION_MODE: strict
          FIPS_LOG_RESULTS: "true"
        continue-on-error: true

  contract-wasm-build:
    name: Soroban Contract — WASM Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.91"
          targets: wasm32v1-none
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Build WASM (release)
        run: cargo build --target wasm32v1-none --release --locked
      - name: Verify WASM output
        run: |
          WASM=target/wasm32v1-none/release/anonvote.wasm
          if [[ ! -f "$WASM" ]]; then
            echo "Error: $WASM not found after build"
            exit 1
          fi
          SIZE=$(wc -c < "$WASM")
          if [[ "$SIZE" -eq 0 ]]; then
            echo "Error: $WASM is empty"
            exit 1
          fi
          echo "WASM OK — ${SIZE} bytes at $WASM"
      - name: Run cargo tests
        run: cargo test --locked

  contract-service-test:
    name: Contract Service — TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies (service)
        working-directory: packages/contracts/service
        run: npm install
      - name: Run TypeScript tests
        working-directory: packages/contracts/service
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm run build

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm audit --audit-level=moderate
        continue-on-error: true

  all-checks-passed:
    runs-on: ubuntu-latest
    needs: [lint, build, contract-service-test]
    if: always()
    steps:
      - name: Check if all critical checks passed
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" || "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ Critical checks failed (lint or build)"
            exit 1
          fi
          echo "✅ All critical checks passed!"

version: 2

updates:
  # Rust dependencies
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    commit-message:
      prefix: "chore(deps):"
    reviewers:
      - AnonVote/core-maintainers
    allow:
      - dependency-type: "all"
    ignore:
      # Major version updates should be reviewed manually for Soroban SDK
      - dependency-name: "soroban-sdk"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  # Node.js dependencies
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    commit-message:
      prefix: "chore(deps):"
    reviewers:
      - AnonVote/core-maintainers
    allow:
      - dependency-type: "all"
    ignore:
      # Major versions require manual review
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    commit-message:
      prefix: "ci(actions):"
    reviewers:
      - AnonVote/core-maintainers
    open-pull-requests-limit: 5

# Soroban build configuration for soroban-sdk 21.x
#
# THE LOAD-BEARING FIX IS THE TOOLCHAIN, NOT THE RUSTFLAGS BELOW.
#
# Background: since rustc 1.82, the `wasm32-unknown-unknown` target enables the
# WASM `reference-types` and `multivalue` proposals *by default*. The Soroban
# host shipped with soroban-sdk 21 (soroban-env 21) only accepts MVP-era WASM
# and rejects those proposals at upload time with:
#     HostError: Error(WasmVm, InvalidAction)
#     "reference-types not enabled: zero byte expected"
#
# The `-C target-feature=-reference-types,-multivalue` flags below do NOT strip
# the feature on rustc >= 1.82 (verified: the emitted WASM is byte-identical and
# still rejected on-chain). They are kept only as a defensive, explicit signal of
# intent; on their own they are insufficient.
#
# The actual fix is to BUILD WITH rustc 1.81.0 — the last release before
# reference-types became a default target feature. 1.81 does not emit the
# proposals, so the resulting WASM uploads cleanly. Reproducible build:
#
#     rustup toolchain install 1.81.0
#     rustup target add wasm32-unknown-unknown --toolchain 1.81.0
#     rustup run 1.81.0 cargo build --target wasm32-unknown-unknown --release --locked
#
# The committed Cargo.lock pins several transitive deps to pre-`edition2024`
# versions so cargo 1.81 can parse the graph (base64ct, time/time-core, zeroize,
# indexmap, ethnum). Do NOT `cargo update` these without re-checking the 1.81
# build. Note: soroban-sdk 21 predates the `wasm32v1-none` target and cannot
# build against it (its ungated `extern crate std;` fails to resolve), so
# `stellar contract build` (which forces `wasm32v1-none`) is not usable here.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=-reference-types,-multivalue"]
